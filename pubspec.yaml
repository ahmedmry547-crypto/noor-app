name: ayat_quran
description: Ayat Quran - Offline Quran, azkar, prayer times and Quran audio
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  adhan: ^2.0.0+1
  geolocator: ^13.0.4
  intl: any
  hijri: ^3.0.0
  http: ^1.2.1
  just_audio: any
  just_audio_background: any
  permission_handler: any
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/quran/
    - assets/images/
